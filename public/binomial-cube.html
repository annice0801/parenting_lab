<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>二項式積木屋</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Noto+Sans+TC:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  :root{
    --bg:#F8F1E4;
    --bg-soft:#EFE1C5;
    --card:#FFFBF3;
    --ink:#4A3B2C;
    --ink-soft:#9C8368;
    --red:#B97A63;
    --red-deep:#96593F;
    --blue:#7D93A0;
    --blue-deep:#5C7482;
    --block-dark:#3B2E22;
    --wood:#DCC29A;
    --wood-edge:#B89164;
    --pink:#D9AFA0;
    --yellow:#E3BE7E;
    --mint:#9CAF95;
    --ring:#E3BE7E;
    --shadow: rgba(74,59,44,0.16);
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding: 20px 18px 44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  header{ text-align:center; }
  .eyebrow{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.08em;
    color:var(--red-deep);
  }
  h1{
    font-weight:800;
    font-size:clamp(24px,6vw,30px);
    margin:4px 0 6px;
    text-wrap:balance;
  }
  .hint{
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .progress{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .progress b{
    color:var(--red-deep);
    font-variant-numeric: tabular-nums;
  }

  /* 3D scene */
  .scene-wrap{
    width:100%;
    aspect-ratio: 6 / 5;
    background: var(--bg-soft);
    border-radius:28px;
    box-shadow: 0 14px 26px var(--shadow);
    padding:8px;
    position:relative;
  }
  .scene-wrap canvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:20px;
    touch-action: none;
    cursor: grab;
  }
  .scene-wrap canvas:active{ cursor: grabbing; }
  .scene-fallback{
    position:absolute; inset:8px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:20px;
    font-size:13px; color:var(--ink-soft);
    border-radius:20px;
  }

  /* blocks tray */
  .pool-label{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:700;
    letter-spacing:.03em;
    align-self:flex-start;
  }
  .pool{
    width:100%;
    background:var(--card);
    border-radius:22px;
    padding:16px;
    box-shadow: 0 4px 14px var(--shadow);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:96px;
  }

  .piece{
    width:72px;
    border-radius:16px;
    background: var(--card);
    box-shadow:
      0 3px 0 var(--pc-dark, rgba(0,0,0,0.2)),
      0 6px 10px var(--shadow);
    cursor: grab;
    touch-action: none;
    position: relative;
    transition: box-shadow .15s ease, transform .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    padding:6px 4px 5px;
  }
  .piece img{
    width:100%;
    height:52px;
    object-fit:contain;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .piece span{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:11.5px;
    color: var(--ink-soft);
  }
  .piece:focus-visible{
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }
  .piece.dragging{
    cursor:grabbing;
    transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 12px 20px var(--shadow);
    z-index: 60;
  }
  .piece.selected{
    animation: bob 0.9s ease-in-out infinite;
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.35),
      0 3px 0 var(--pc-dark, rgba(0,0,0,0.25)),
      0 0 0 4px var(--ring),
      0 6px 10px var(--shadow);
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }
  .piece.flying{
    transition: left .3s cubic-bezier(.34,1.15,.64,1), top .3s cubic-bezier(.34,1.15,.64,1), transform .3s ease, opacity .25s ease .05s;
  }

  .piece.kind-cube-red, .piece.kind-a2b{ --pc-dark: var(--red-deep); }
  .piece.kind-cube-blue, .piece.kind-ab2{ --pc-dark: var(--blue-deep); }

  .reset-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    color:#fff;
    background: var(--mint);
    border:none;
    padding: 11px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow: 0 3px 0 #7A8F73, 0 6px 12px var(--shadow);
    transition: transform .12s ease;
  }
  .reset-btn:active{ transform: translateY(2px); }

  /* sparkle burst on correct placement */
  .sparkle{
    position:fixed;
    width:8px;height:8px;
    border-radius:50%;
    background: var(--sc, var(--yellow));
    pointer-events:none;
    z-index:80;
    animation: sparkle-out .6s ease-out forwards;
  }
  @keyframes sparkle-out{
    0%{ transform: translate(0,0) scale(1); opacity:1; }
    100%{ transform: translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  /* gentle wrong-slot toast */
  .oops{
    position:fixed;
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--card);
    color: var(--ink);
    border-radius:999px;
    padding: 8px 16px 8px 8px;
    box-shadow: 0 8px 18px var(--shadow);
    font-size:13.5px;
    font-weight:600;
    z-index:90;
    transform: translate(-50%,-100%);
    opacity:0;
    animation: oops-in .25s ease forwards;
  }
  .oops.leaving{ animation: oops-out .3s ease forwards; }
  @keyframes oops-in{
    0%{ opacity:0; transform: translate(-50%,-90%) scale(0.8); }
    60%{ transform: translate(-50%,-108%) scale(1.05); }
    100%{ opacity:1; transform: translate(-50%,-100%) scale(1); }
  }
  @keyframes oops-out{
    to{ opacity:0; transform: translate(-50%,-70%) scale(0.85); }
  }
  .oops .badge{
    width:26px;height:26px;
    border-radius:50%;
    background: var(--yellow);
    color:#7A5A1E;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
    animation: wiggle 0.5s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{ transform: rotate(-8deg); }
    50%{ transform: rotate(8deg); }
  }

  /* celebration overlay */
  .celebrate{
    position:fixed; inset:0;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
    opacity:0;
    animation: fade-in .35s ease forwards;
  }
  @keyframes fade-in{ to{ opacity:1; } }
  .celebrate-card{
    position:relative;
    background:var(--card);
    border-radius:32px;
    padding: 28px 26px 24px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: 0 20px 40px var(--shadow);
    transform: scale(0.85) translateY(10px);
    animation: card-in .4s cubic-bezier(.34,1.56,.64,1) forwards .1s;
  }
  @keyframes card-in{ to{ transform: scale(1) translateY(0); } }

  .bear-svg{ width: 170px; height:170px; }
  .heart-pulse{
    transform-origin: 110px 178px;
    animation: heartbeat 1.1s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.14); }
  }
  .twinkle{ animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100%{ opacity:.35; transform: scale(.8); }
    50%{ opacity:1; transform: scale(1.15); }
  }

  .celebrate-title{
    font-weight:800;
    font-size:22px;
    margin: 6px 0 4px;
  }
  .celebrate-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin: 0 0 16px;
  }

  .confetti-piece{
    position:fixed;
    top:-24px;
    border-radius:3px;
    z-index:105;
    animation-name: confetti-fall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(var(--fall,700px)) rotate(var(--spin,360deg)); opacity:0.15; }
  }

  @media (prefers-reduced-motion: reduce){
    .piece.selected{ animation:none; }
    .oops .badge{ animation:none; }
    .heart-pulse, .twinkle{ animation:none; }
  }

  footer{
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    opacity:.8;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">MONTESSORI · 感官教具</div>
    <h1>二項式積木屋</h1>
    <p class="hint">選一塊積木，拖進立方體淡色提示的位置吧！也可以轉一轉立方體看看角度。</p>
  </header>

  <div class="progress">已放置 <b id="progressCount">0</b> / 8 個積木</div>

  <div class="scene-wrap" id="sceneWrap">
    <canvas id="scene3d" role="img" aria-label="二項式立方體 3D 展示區，可拖拽積木放入"></canvas>
  </div>

  <div class="pool-label">積木盤</div>
  <div class="pool" id="pool"></div>

  <button class="reset-btn" id="resetBtn" type="button">🔄 重新開始</button>

  <footer>點一下積木再點立方體，或直接拖拽放進去</footer>
</div>

<script>
(function(){
  "use strict";

  var PIECES = [
    { id:'red-cube', xSeg:'a', ySeg:'a', zSeg:'a', kind:'cube-red',  label:'a³'  },
    { id:'rb-1',      xSeg:'a', ySeg:'a', zSeg:'b', kind:'a2b',      label:'a²b' },
    { id:'rb-2',      xSeg:'a', ySeg:'b', zSeg:'a', kind:'a2b',      label:'a²b' },
    { id:'rb-3',      xSeg:'b', ySeg:'a', zSeg:'a', kind:'a2b',      label:'a²b' },
    { id:'bb-1',      xSeg:'a', ySeg:'b', zSeg:'b', kind:'ab2',      label:'ab²' },
    { id:'bb-2',      xSeg:'b', ySeg:'a', zSeg:'b', kind:'ab2',      label:'ab²' },
    { id:'bb-3',      xSeg:'b', ySeg:'b', zSeg:'a', kind:'ab2',      label:'ab²' },
    { id:'blue-cube', xSeg:'b', ySeg:'b', zSeg:'b', kind:'cube-blue',label:'b³'  }
  ];

  var UNIT_A = 1.5, UNIT_B = 0.75;
  var EDGE = UNIT_A + UNIT_B;

  var pool = document.getElementById('pool');
  var resetBtn = document.getElementById('resetBtn');
  var progressCount = document.getElementById('progressCount');
  var sceneWrap = document.getElementById('sceneWrap');
  var canvas = document.getElementById('scene3d');

  var pieceEls = {};
  var filledCount = 0;
  var selectedPiece = null;
  var placedIds = {};

  /* ---------- 3D scene ---------- */
  var scene, camera, renderer, raycaster, cubeGroup;
  var cellMeshes = [];
  var cellByPieceId = {};
  var popAnimations = [];
  var sceneReady = false;

  var colorRed, colorBlue, colorBlack;
  var ghostRedMat, ghostBlueMat, solidRedMat, solidBlueMat, solidBlackMat;

  var orbitTarget, orbitRadius, orbitTheta, orbitPhi;
  var ORBIT_MIN_PHI = 0.35, ORBIT_MAX_PHI = 1.48, ORBIT_SPEED = 0.007;

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function axisInfo(seg){
    return seg === 'a' ? { start: 0, size: UNIT_A } : { start: UNIT_A, size: UNIT_B };
  }

  function isRedFamily(kind){ return kind === 'cube-red' || kind === 'a2b'; }

  function solidMaterialsFor(kind){
    if(kind === 'cube-red') return [solidRedMat,solidRedMat,solidRedMat,solidRedMat,solidRedMat,solidRedMat];
    if(kind === 'cube-blue') return [solidBlueMat,solidBlueMat,solidBlueMat,solidBlueMat,solidBlueMat,solidBlueMat];
    if(kind === 'a2b') return [solidRedMat,solidRedMat,solidBlackMat,solidRedMat,solidRedMat,solidRedMat];
    return [solidBlueMat,solidBlueMat,solidBlackMat,solidBlueMat,solidBlueMat,solidBlueMat];
  }

  function setupMaterials(){
    colorRed = new THREE.Color(cssVar('--red') || '#B97A63');
    colorBlue = new THREE.Color(cssVar('--blue') || '#7D93A0');
    colorBlack = new THREE.Color(cssVar('--block-dark') || '#3B2E22');
    ghostRedMat = new THREE.MeshStandardMaterial({ color: colorRed, transparent: true, opacity: 0.16, roughness: 0.6, depthWrite: false });
    ghostBlueMat = new THREE.MeshStandardMaterial({ color: colorBlue, transparent: true, opacity: 0.16, roughness: 0.6, depthWrite: false });
    solidRedMat = new THREE.MeshStandardMaterial({ color: colorRed, roughness: 0.5 });
    solidBlueMat = new THREE.MeshStandardMaterial({ color: colorBlue, roughness: 0.5 });
    solidBlackMat = new THREE.MeshStandardMaterial({ color: colorBlack, roughness: 0.6 });
  }

  function updateCameraFromOrbit(){
    camera.position.set(
      orbitTarget.x + orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta),
      orbitTarget.y + orbitRadius * Math.cos(orbitPhi),
      orbitTarget.z + orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta)
    );
    camera.lookAt(orbitTarget);
  }

  function attachOrbitControls(){
    canvas.addEventListener('pointerdown', function(e){
      var startX = e.clientX, startY = e.clientY;
      var startTheta = orbitTheta, startPhi = orbitPhi;
      var moved = false;
      canvas.setPointerCapture(e.pointerId);

      function onMove(ev){
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(Math.abs(dx) + Math.abs(dy) > 5) moved = true;
        orbitTheta = startTheta - dx * ORBIT_SPEED;
        orbitPhi = Math.min(ORBIT_MAX_PHI, Math.max(ORBIT_MIN_PHI, startPhi - dy * ORBIT_SPEED));
        updateCameraFromOrbit();
      }
      function onUp(ev){
        canvas.releasePointerCapture(e.pointerId);
        canvas.removeEventListener('pointermove', onMove);
        canvas.removeEventListener('pointerup', onUp);
        canvas.removeEventListener('pointercancel', onUp);
        if(!moved) handleCanvasTap(ev.clientX, ev.clientY);
      }
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
    });
  }

  function handleCanvasTap(x, y){
    if(!selectedPiece) return;
    var el = selectedPiece;
    var cell = raycastAtClient(x, y);
    if(!cell) return;

    selectedPiece = null;
    el.classList.remove('selected');
    var origParent = el.parentNode;
    var origNext = el.nextSibling;
    var rect = el.getBoundingClientRect();
    el.style.position = 'fixed';
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.style.margin = '0';
    document.body.appendChild(el);

    attemptPlace(el, cell, origParent, origNext, x, y, rect);
  }

  function generateThumbnails(){
    var size = 140;
    var tCanvas = document.createElement('canvas');
    var tRenderer = new THREE.WebGLRenderer({ canvas: tCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    tRenderer.setSize(size, size, false);
    tRenderer.setPixelRatio(2);
    var tScene = new THREE.Scene();
    tScene.add(new THREE.AmbientLight(0xfff2df, 0.85));
    var tdl = new THREE.DirectionalLight(0xffffff, 0.9);
    tdl.position.set(3, 5, 4);
    tScene.add(tdl);
    var tCamera = new THREE.PerspectiveCamera(28, 1, 0.05, 20);

    PIECES.forEach(function(piece){
      var xi = axisInfo(piece.xSeg), yi = axisInfo(piece.ySeg), zi = axisInfo(piece.zSeg);
      var geom = new THREE.BoxGeometry(xi.size, yi.size, zi.size);
      var mesh = new THREE.Mesh(geom, solidMaterialsFor(piece.kind));
      tScene.add(mesh);

      var maxDim = Math.max(xi.size, yi.size, zi.size);
      var dist = maxDim * 2.7;
      tCamera.position.set(dist * 0.8, dist * 0.62, dist * 0.85);
      tCamera.lookAt(0, 0, 0);

      tRenderer.render(tScene, tCamera);
      piece.thumb = tCanvas.toDataURL('image/png');

      tScene.remove(mesh);
      geom.dispose();
    });

    tRenderer.dispose();
  }

  function initScene(){
    if(typeof THREE === 'undefined'){
      var fb = document.createElement('div');
      fb.className = 'scene-fallback';
      fb.textContent = '3D 積木需要較新的瀏覽器才能顯示喔';
      sceneWrap.appendChild(fb);
      return;
    }
    try{
      setupMaterials();
      generateThumbnails();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);

      orbitTarget = new THREE.Vector3(EDGE*0.55, EDGE*0.5, EDGE*0.55);
      orbitRadius = EDGE * 2.48;
      orbitTheta = 0.6435;
      orbitPhi = 1.134;
      updateCameraFromOrbit();

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      scene.add(new THREE.AmbientLight(0xfff2df, 0.75));
      var dl = new THREE.DirectionalLight(0xffffff, 0.85);
      dl.position.set(EDGE*1.5, EDGE*3, EDGE*2);
      scene.add(dl);

      var woodMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(cssVar('--wood') || '#DCC29A'), roughness: 0.85 });

      var floorGeom = new THREE.BoxGeometry(EDGE*1.2, EDGE*0.08, EDGE*1.2);
      var floor = new THREE.Mesh(floorGeom, woodMat);
      floor.position.set(EDGE/2, -EDGE*0.04, EDGE/2);
      scene.add(floor);

      var wallGeom = new THREE.BoxGeometry(EDGE*1.2, EDGE*1.25, EDGE*0.08);
      var wall = new THREE.Mesh(wallGeom, woodMat);
      wall.position.set(EDGE/2, EDGE*1.25/2 - EDGE*0.04, -EDGE*0.04);
      scene.add(wall);

      cubeGroup = new THREE.Group();
      scene.add(cubeGroup);

      PIECES.forEach(function(piece){
        var xi = axisInfo(piece.xSeg), yi = axisInfo(piece.ySeg), zi = axisInfo(piece.zSeg);
        var geom = new THREE.BoxGeometry(xi.size, yi.size, zi.size);
        var ghostMat = isRedFamily(piece.kind) ? ghostRedMat : ghostBlueMat;
        var mesh = new THREE.Mesh(geom, [ghostMat,ghostMat,ghostMat,ghostMat,ghostMat,ghostMat]);
        mesh.position.set(xi.start + xi.size/2, yi.start + yi.size/2, zi.start + zi.size/2);
        mesh.userData = { pieceId: piece.id, kind: piece.kind, filled: false, solidMats: solidMaterialsFor(piece.kind), ghostMat: ghostMat };
        cubeGroup.add(mesh);

        var edgeGeom = new THREE.EdgesGeometry(geom);
        var lineMat = new THREE.LineBasicMaterial({ color: isRedFamily(piece.kind) ? colorRed : colorBlue, transparent: true, opacity: 0.55 });
        var lines = new THREE.LineSegments(edgeGeom, lineMat);
        lines.position.copy(mesh.position);
        cubeGroup.add(lines);

        cellMeshes.push(mesh);
        cellByPieceId[piece.id] = mesh;
      });

      raycaster = new THREE.Raycaster();
      attachOrbitControls();
      resizeRenderer();
      window.addEventListener('resize', resizeRenderer);
      if(window.ResizeObserver){
        new ResizeObserver(resizeRenderer).observe(sceneWrap);
      }

      sceneReady = true;
      requestAnimationFrame(tick);
    }catch(e){
      var fb2 = document.createElement('div');
      fb2.className = 'scene-fallback';
      fb2.textContent = '3D 積木暫時無法顯示，請重新整理頁面試試';
      sceneWrap.appendChild(fb2);
    }
  }

  function resizeRenderer(){
    if(!renderer) return;
    var w = sceneWrap.clientWidth - 16;
    var h = sceneWrap.clientHeight - 16;
    if(w <= 0 || h <= 0){
      requestAnimationFrame(resizeRenderer);
      return;
    }
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function easeOutBack(t){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function tick(now){
    requestAnimationFrame(tick);
    for(var i = popAnimations.length - 1; i >= 0; i--){
      var a = popAnimations[i];
      var t = (now - a.start) / a.duration;
      if(t >= 1){
        a.mesh.scale.setScalar(1);
        popAnimations.splice(i, 1);
        continue;
      }
      var eased = easeOutBack(Math.max(0, t));
      a.mesh.scale.setScalar(0.5 + 0.5 * eased);
    }
    renderer.render(scene, camera);
  }

  function fillCell(mesh){
    mesh.material = mesh.userData.solidMats;
    mesh.userData.filled = true;
    mesh.scale.setScalar(0.5);
    popAnimations.push({ mesh: mesh, start: performance.now(), duration: 340 });
  }

  function resetCell(mesh){
    var ghostMat = mesh.userData.ghostMat;
    mesh.material = [ghostMat,ghostMat,ghostMat,ghostMat,ghostMat,ghostMat];
    mesh.userData.filled = false;
    mesh.scale.setScalar(1);
  }

  function projectToScreen(vec3){
    var rect = canvas.getBoundingClientRect();
    var v = vec3.clone().project(camera);
    return {
      x: (v.x * 0.5 + 0.5) * rect.width + rect.left,
      y: (1 - (v.y * 0.5 + 0.5)) * rect.height + rect.top
    };
  }

  function isOverCanvas(x, y){
    var r = canvas.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  function raycastAtClient(x, y){
    if(!sceneReady) return null;
    var rect = canvas.getBoundingClientRect();
    var ndcX = ((x - rect.left) / rect.width) * 2 - 1;
    var ndcY = -(((y - rect.top) / rect.height) * 2 - 1);
    raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
    var hits = raycaster.intersectObjects(cellMeshes, false);
    for(var i = 0; i < hits.length; i++){
      if(!hits[i].object.userData.filled) return hits[i].object;
    }
    return null;
  }

  /* ---------- pool / drag / drop ---------- */

  function shuffledPieces(){
    var arr = PIECES.slice();
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildPool(){
    pool.innerHTML = '';
    pieceEls = {};
    shuffledPieces().forEach(function(p){
      var el = document.createElement('div');
      el.className = 'piece kind-' + p.kind;
      el.dataset.piece = p.id;
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', '積木 ' + p.label);
      el.innerHTML = (p.thumb ? '<img src="' + p.thumb + '" alt="">' : '') + '<span>' + p.label + '</span>';
      pool.appendChild(el);
      pieceEls[p.id] = el;
      attachPieceEvents(el);
    });
  }

  function attachPieceEvents(el){
    el.addEventListener('pointerdown', function(e){
      if(el.classList.contains('flying') || el.dataset.done) return;
      var pointerId = e.pointerId;
      var moved = false;
      var rect = el.getBoundingClientRect();
      var grabX = e.clientX - rect.left;
      var grabY = e.clientY - rect.top;
      var origParent = el.parentNode;
      var origNext = el.nextSibling;
      var lastX = e.clientX, lastY = e.clientY;

      el.setPointerCapture(pointerId);
      el.classList.add('dragging');
      el.style.position = 'fixed';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      el.style.margin = '0';
      document.body.appendChild(el);

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        lastX = ev.clientX; lastY = ev.clientY;
        if(Math.abs(ev.clientX - (rect.left + grabX)) + Math.abs(ev.clientY - (rect.top + grabY)) > 5) moved = true;
        el.style.left = (ev.clientX - grabX) + 'px';
        el.style.top = (ev.clientY - grabY) + 'px';
      }

      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        el.releasePointerCapture(pointerId);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        el.classList.remove('dragging');

        if(moved){
          handleDrop(el, lastX, lastY, origParent, origNext, rect);
        }else{
          el.style.position = '';
          el.style.left = '';
          el.style.top = '';
          el.style.margin = '';
          returnToParent(el, origParent, origNext);
          toggleSelect(el);
        }
      }

      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
    });

    el.addEventListener('keydown', function(e){
      if((e.key === 'Enter' || e.key === ' ') && !el.dataset.done){
        e.preventDefault();
        toggleSelect(el);
      }
    });
  }

  function toggleSelect(el){
    if(selectedPiece === el){
      el.classList.remove('selected');
      selectedPiece = null;
      return;
    }
    if(selectedPiece) selectedPiece.classList.remove('selected');
    selectedPiece = el;
    el.classList.add('selected');
  }

  function handleDrop(el, x, y, origParent, origNext, homeRect){
    if(isOverCanvas(x, y)){
      var cell = raycastAtClient(x, y);
      if(cell){
        attemptPlace(el, cell, origParent, origNext, x, y, homeRect);
        return;
      }
    }
    springBack(el, origParent, origNext, homeRect);
  }

  function attemptPlace(el, cell, origParent, origNext, dropX, dropY, homeRect){
    var pieceId = el.dataset.piece;
    if(cell.userData.pieceId === pieceId){
      placeCorrectly(el, cell);
    }else{
      wrongSlot(dropX, dropY);
      springBack(el, origParent, origNext, homeRect);
    }
  }

  function returnToParent(el, origParent, origNext){
    try{
      if(origNext && origNext.parentNode === origParent){
        origParent.insertBefore(el, origNext);
      }else{
        origParent.appendChild(el);
      }
    }catch(e){
      origParent.appendChild(el);
    }
  }

  function placeCorrectly(el, cell){
    var target = projectToScreen(cell.position);
    var w = el.getBoundingClientRect().width;

    el.classList.add('flying');
    el.style.left = (target.x - w/2) + 'px';
    el.style.top = (target.y - w/2) + 'px';
    el.style.transform = 'scale(0.3)';
    el.style.opacity = '0';

    var kindColor = (cell.userData.kind === 'cube-red' || cell.userData.kind === 'a2b') ? 'var(--red)' : 'var(--blue)';

    setTimeout(function(){
      el.remove();
      fillCell(cell);
      sparkleBurst(target.x, target.y, kindColor);
      playDing();

      filledCount++;
      progressCount.textContent = String(filledCount);
      placedIds[cell.userData.pieceId] = true;

      if(filledCount === PIECES.length){
        setTimeout(celebrate, 300);
      }
    }, 300);
  }

  function springBack(el, origParent, origNext, homeRect){
    el.classList.add('flying');
    el.style.left = homeRect.left + 'px';
    el.style.top = homeRect.top + 'px';

    setTimeout(function(){
      el.classList.remove('flying');
      el.style.position = '';
      el.style.left = '';
      el.style.top = '';
      el.style.margin = '';
      returnToParent(el, origParent, origNext);
    }, 300);
  }

  function wrongSlot(x, y){
    var toast = document.createElement('div');
    toast.className = 'oops';
    toast.style.left = x + 'px';
    toast.style.top = y + 'px';
    toast.innerHTML = '<span class="badge">！</span><span>再試一次看看喔～</span>';
    document.body.appendChild(toast);
    setTimeout(function(){
      toast.classList.add('leaving');
      setTimeout(function(){ toast.remove(); }, 320);
    }, 1300);
  }

  function sparkleBurst(x, y, color){
    for(var i = 0; i < 10; i++){
      var s = document.createElement('div');
      s.className = 'sparkle';
      var angle = (Math.PI * 2 * i) / 10;
      var dist = 36 + Math.random() * 22;
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      s.style.setProperty('--sc', color);
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      document.body.appendChild(s);
      (function(node){ setTimeout(function(){ node.remove(); }, 620); })(s);
    }
  }

  /* ---------- audio ---------- */
  var audioCtx = null;
  function getAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function playTone(freq, start, dur, gainPeak){
    var ctx = getAudio();
    if(!ctx) return;
    try{
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(gainPeak, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.02);
    }catch(e){}
  }
  function playDing(){
    playTone(740, 0, 0.18, 0.06);
    playTone(988, 0.08, 0.22, 0.05);
  }
  function playFanfare(){
    [523,659,784,1047].forEach(function(f, i){ playTone(f, i * 0.14, 0.3, 0.07); });
  }

  /* ---------- celebration ---------- */
  function celebrate(){
    playFanfare();
    var overlay = document.createElement('div');
    overlay.className = 'celebrate';
    overlay.innerHTML =
      '<div class="celebrate-card">' +
        bearSVG() +
        '<div class="celebrate-title">你完成了！好棒喔！</div>' +
        '<p class="celebrate-sub">紅色、黑色、藍色都排得整整齊齊呢</p>' +
        '<button class="reset-btn" id="playAgainBtn" type="button">再玩一次</button>' +
      '</div>';
    document.body.appendChild(overlay);
    spawnConfetti();
    document.getElementById('playAgainBtn').addEventListener('click', function(){
      overlay.remove();
      resetAll();
    });
  }

  function bearSVG(){
    return '' +
    '<svg class="bear-svg" viewBox="0 0 220 220" aria-hidden="true">' +
      '<ellipse cx="110" cy="196" rx="70" ry="10" fill="rgba(91,70,54,0.12)"/>' +
      '<path d="M58,150 Q110,128 162,150 L170,208 Q110,224 50,208 Z" fill="#E4BD8C"/>' +
      '<ellipse cx="90" cy="185" rx="19" ry="15" fill="#C79760"/>' +
      '<ellipse cx="130" cy="185" rx="19" ry="15" fill="#C79760"/>' +
      '<g class="heart-pulse">' +
        '<path d="M110,196 C96,182 78,172 78,156 C78,144 88,136 98,140 C104,142 108,148 110,152 C112,148 116,142 122,140 C132,136 142,144 142,156 C142,172 124,182 110,196 Z" fill="#C2694F"/>' +
      '</g>' +
      '<circle cx="62" cy="55" r="22" fill="#C79760"/>' +
      '<circle cx="158" cy="55" r="22" fill="#C79760"/>' +
      '<circle cx="62" cy="55" r="11" fill="#F1C6B9"/>' +
      '<circle cx="158" cy="55" r="11" fill="#F1C6B9"/>' +
      '<circle cx="110" cy="100" r="62" fill="#D9AD79"/>' +
      '<ellipse cx="72" cy="108" rx="10" ry="6" fill="#D9AFA0" opacity="0.6"/>' +
      '<ellipse cx="148" cy="108" rx="10" ry="6" fill="#D9AFA0" opacity="0.6"/>' +

      '<g class="twinkle" style="transform-origin:36px 60px">' +
        '<path d="M36,50 L39,58 L47,60 L39,62 L36,70 L33,62 L25,60 L33,58 Z" fill="#E3BE7E"/>' +
      '</g>' +
      '<g class="twinkle" style="transform-origin:186px 90px;animation-delay:.4s">' +
        '<path d="M186,80 L189,88 L197,90 L189,92 L186,100 L183,92 L175,90 L183,88 Z" fill="#D9AFA0"/>' +
      '</g>' +
      '<g class="twinkle" style="transform-origin:176px 40px;animation-delay:.8s">' +
        '<path d="M176,33 L178,39 L184,40 L178,41 L176,47 L174,41 L168,40 L174,39 Z" fill="#7D93A0"/>' +
      '</g>' +
    '</svg>';
  }

  function spawnConfetti(){
    var colors = ['#B97A63','#7D93A0','#E3BE7E','#9CAF95','#D9AFA0'];
    for(var i = 0; i < 28; i++){
      var c = document.createElement('div');
      c.className = 'confetti-piece';
      var isRibbon = Math.random() > 0.6;
      var w = isRibbon ? (4 + Math.random()*3) : (6 + Math.random()*5);
      var h = isRibbon ? (14 + Math.random()*10) : w;
      c.style.width = w + 'px';
      c.style.height = h + 'px';
      c.style.left = (Math.random()*100) + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = isRibbon ? '2px' : '50%';
      var dur = 1.8 + Math.random()*1.4;
      c.style.animationDuration = dur + 's';
      c.style.animationDelay = (Math.random()*0.6) + 's';
      c.style.setProperty('--fall', (window.innerHeight + 60) + 'px');
      c.style.setProperty('--spin', (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random()*360) + 'deg');
      document.body.appendChild(c);
      (function(node, life){ setTimeout(function(){ node.remove(); }, life*1000 + 900); })(c, dur);
    }
  }

  function resetAll(){
    filledCount = 0;
    placedIds = {};
    selectedPiece = null;
    progressCount.textContent = '0';
    document.querySelectorAll('.confetti-piece, .sparkle, .oops').forEach(function(n){ n.remove(); });
    if(sceneReady){ cellMeshes.forEach(resetCell); }
    buildPool();
  }

  resetBtn.addEventListener('click', resetAll);

  initScene();
  buildPool();
})();
</script>
